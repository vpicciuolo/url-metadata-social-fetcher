<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Live on BeHot.Now</title>
  <desc id="desc">The URL Metadata and Social Profile Fetcher is used live by BeHot.Now.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/><stop offset="0.58" stop-color="#0a0d18"/><stop offset="1" stop-color="#19082b"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a00"/><stop offset="0.45" stop-color="#ff2d2d"/><stop offset="1" stop-color="#7a22d3"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d2d"/><stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="520" rx="30" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1597" height="517" rx="28" fill="none" stroke="#303643" stroke-width="3"/>

  <rect x="58" y="45" width="300" height="55" rx="28" fill="#0c101a" stroke="#ff4b22" stroke-width="2"/>
  <path d="M91 82c-14-10-10-27 2-38 1 9 8 12 9 19 5-4 8-10 8-17 11 12 13 27 4 37-6 7-17 9-23-1z" fill="#ff5a1f"/>
  <text x="128" y="80" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">Live production use case</text>

  <text x="58" y="188" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="800">Live on</text>
  <text x="58" y="272" fill="url(#hot)" font-family="Arial,Helvetica,sans-serif" font-size="88" font-weight="900">BeHot.Now</text>
  <text x="58" y="322" fill="#c8cbd2" font-family="Arial,Helvetica,sans-serif" font-size="27">Paste a website, profile, product, project or startup URL.</text>
  <text x="58" y="360" fill="#c8cbd2" font-family="Arial,Helvetica,sans-serif" font-size="27">Auto-fill title, logo, description, canonical URL and social links.</text>

  <rect x="58" y="401" width="390" height="78" rx="39" fill="url(#btn)" filter="url(#glow)"/>
  <circle cx="102" cy="440" r="25" fill="#ffffff"/>
  <path d="M91 452c-11-8-8-21 2-30 1 7 6 9 7 15 4-3 6-8 6-13 9 9 11 21 3 29-5 5-13 7-18-1z" fill="#ff4a24"/>
  <text x="143" y="449" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800">Visit BeHot.Now →</text>
  <text x="480" y="448" fill="#f2f2f5" font-family="Arial,Helvetica,sans-serif" font-size="26">behot.now/get-hot</text>

  <g transform="translate(1045,42)">
    <circle cx="230" cy="210" r="177" fill="#130d22" stroke="#44215c" stroke-width="2"/>
    <circle cx="230" cy="210" r="142" fill="none" stroke="#4d1c61" opacity="0.7"/>
    <path d="M210 318c-62-23-87-76-64-126 17-36 56-54 53-108 39 26 60 62 45 103 24-18 40-40 41-68 48 43 67 105 38 157-23 41-69 60-113 42z" fill="url(#hot)" filter="url(#glow)"/>
    <ellipse cx="230" cy="224" rx="188" ry="57" fill="none" stroke="#9a34e2" stroke-width="12" transform="rotate(-15 230 224)"/>
    <ellipse cx="230" cy="224" rx="188" ry="57" fill="none" stroke="#ff7a00" stroke-width="4" transform="rotate(-15 230 224)" filter="url(#glow)"/>
    <circle cx="318" cy="102" r="18" fill="#ff3b30"/>
    <path d="M350 330 L435 220 L415 220 L462 145 L458 236 L437 226 Z" fill="#ff5d16" filter="url(#glow)"/>
    <rect x="75" y="390" width="355" height="58" rx="29" fill="#0b0f18" stroke="#3a3e49" stroke-width="2"/>
    <text x="252" y="427" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="24"><tspan fill="#ff6a19" font-weight="700">The Attention</tspan> Marketplace</text>
  </g>
</svg>
