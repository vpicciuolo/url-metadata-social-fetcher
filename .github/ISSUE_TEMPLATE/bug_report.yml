name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not report security vulnerabilities publicly. Use SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0.0.1
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
